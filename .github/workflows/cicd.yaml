name: Deploy app to Windows Server (Self-hosted)

on:
   push:
      branches:
         - develop
   pull_request:
      branches:
         - develop
   workflow_dispatch:

jobs:
   sonarcloud:
      name: SonarCloud
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
           with:
              fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
         - name: Analyze with SonarCloud
           uses: SonarSource/sonarcloud-github-action@master
           env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
              SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

   test:
      name: Test
      runs-on: ubuntu-latest
      steps:
         - name: Checkout code
           uses: actions/checkout@v4

         - name: Install pnpm
           uses: pnpm/action-setup@v4
           with:
              version: 10

         - name: Set up Node.js
           uses: actions/setup-node@v4
           with:
              node-version: '23.x'
              cache: pnpm

         - name: Install dependencies
           run: pnpm install

         - name: Unit testing
           run: pnpm test

   deploy-server-19:
      if: ${{github.ref == 'refs/heads/develop'}}
      name: Deploy to server 0.19
      runs-on: [self-hosted, Server-19]
      needs: test
      steps:
         - name: Checkout code
           uses: actions/checkout@v4
           with:
              fetch-depth: 0
              clean: false

         - name: Load environment variables
           run: |
              $env = "${{ secrets.ENV_VARIABLE_SVR19 }}"
              $env | Out-File -FilePath .env.production -Encoding utf8

         - name: Install dependencies
           run: pnpm install --fix-lockfile

         - name: Build the React app
           run: pnpm build

         - name: Generate PWA assets
           run: pnpm generate-pwa-assets

         - name: Restart IIS server
           run: iisreset

   deploy-server-201:
      if: ${{github.ref == 'refs/heads/develop'}}
      name: Deploy to server 201.201
      runs-on: [self-hosted, Server-201201]
      needs: test
      steps:
         - name: Checkout code
           uses: actions/checkout@v4
           with:
              fetch-depth: 0
              clean: false

         - name: Load environment variables
           run: |
              $env = "${{ secrets.ENV_VARIABLE_SVR201201 }}"
              $env | Out-File -FilePath .env.production -Encoding utf8

         - name: Install dependencies
           run: pnpm install --fix-lockfile

         - name: Build the React app
           run: pnpm build

         - name: Generate PWA assets
           run: pnpm generate-pwa-assets

         - name: Restart IIS server
           run: iisreset

   deploy-server-5251:
      if: ${{github.ref == 'refs/heads/develop'}}
      name: Deploy to server 5.251
      runs-on: [self-hosted, Server-5251]
      needs: test
      steps:
         - name: Checkout code
           uses: actions/checkout@v4
           with:
              fetch-depth: 0
              clean: false

         - name: Load environment variables
           run: |
              $env = "${{ secrets.ENV_VARIABLE_SVR5251 }}"
              $env | Out-File -FilePath .env.production -Encoding utf8

         - name: Install dependencies
           run: pnpm install --fix-lockfile

         - name: Build the React app
           run: pnpm build

         - name: Generate PWA assets
           run: pnpm generate-pwa-assets

         - name: Restart IIS server
           run: iisreset
